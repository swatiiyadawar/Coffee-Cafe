<main class="interior-page reservation-page"><section class="interior-hero reservation-hero"><h1>GET IN<br>TOUCH</h1><img src="/assets/contact-hero.avif" alt="Coffee ready to share at the table"></section>
  <section class="reservation-panel" id="reservation" appReveal><h2>SHARE YOUR<br>COFFEE PLANS</h2><form class="booking-form" #booking="ngForm" (ngSubmit)="reserve(booking)">
    <label>Full Name<input name="name" ngModel autocomplete="name" placeholder="Enter your full name" required></label>
    <label>Email Address<input name="email" ngModel type="email" autocomplete="email" placeholder="Enter your email address" required email></label>
    <label>Phone Number<input name="phone" ngModel type="tel" autocomplete="tel" placeholder="Enter your phone number" required pattern="^[+()0-9][+()0-9 .-]{6,}$"></label>
    <label>Purpose of Visit<select name="purpose" ngModel required><option value="" selected disabled>Choose your purpose</option><option>Table Reservation</option><option>Birthday / Party Booking</option><option>Corporate Event</option><option>General Inquiry</option><option>Catering Inquiry</option><option>Feedback</option><option>Other</option></select></label>
    <label>Preferred Date<input name="preferred_date" ngModel type="date"></label>
    <label class="notes-field">Message<textarea name="message" ngModel rows="4" placeholder="Tell us how we can help..." required></textarea></label>
    <input type="text" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" class="web3forms-honeypot">
    <button type="submit" class="pill dark-pill" [disabled]="sending">{{ sending ? 'SENDING…' : 'SEND INQUIRY' }} <span>↗</span></button><p class="reservation-response" [class.error]="hasError" role="status" aria-live="polite">{{ response }}</p>
  </form></section><app-ticker [bottom]="true" />
</main>
